<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0d1117; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="git-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05032" />
      <stop offset="100%" stop-color="#fa7035" />
    </linearGradient>

    <linearGradient id="gitlab-color" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fc6d26" />
      <stop offset="100%" stop-color="#e24329" />
    </linearGradient>

    <linearGradient id="github-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .pulse-node-2 {
      animation: pulse 3s infinite ease-in-out 1.5s;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: flow 20s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 6 6;
      animation: flow-rev 15s linear infinite;
    }
    .pill {
      transition: transform 0.3s ease;
    }
    .badge-float {
      animation: float 4s ease-in-out infinite;
    }
    .badge-float-alt {
      animation: float 4s ease-in-out infinite 2s;
    }

    @keyframes pulse {
      0%, 100% { r: 6px; opacity: 0.6; }
      50% { r: 10px; opacity: 1; }
    }
    @keyframes flow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flow-rev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" />

  <!-- Animated Subtle Grid Pattern in Background -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#30363d" stroke-width="1" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Background Dynamic Pipeline & Branch Connections (Behind Text) -->
  <g opacity="0.35">
    <!-- Git Branch Line 1 -->
    <path d="M 80,180 C 220,180 260,80 400,80 L 800,80 C 940,80 980,180 1120,180" fill="none" stroke="#58a6ff" stroke-width="2.5" class="flow-line" />
    <!-- Git Branch Line 2 -->
    <path d="M 80,180 C 220,180 260,280 400,280 L 800,280 C 940,280 980,180 1120,180" fill="none" stroke="#f05032" stroke-width="2.5" class="flow-line-reverse" />
    <!-- Straight Hub Line -->
    <path d="M 60,180 L 1140,180" fill="none" stroke="#30363d" stroke-width="2" />
    
    <!-- Background Animated Graph Nodes -->
    <circle cx="260" cy="80" r="7" fill="#58a6ff" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="940" cy="80" r="7" fill="#58a6ff" class="pulse-node-2" filter="url(#soft-glow)" />
    <circle cx="260" cy="280" r="7" fill="#f05032" class="pulse-node-2" filter="url(#soft-glow)" />
    <circle cx="940" cy="280" r="7" fill="#f05032" class="pulse-node" filter="url(#soft-glow)" />
  </g>

  <!-- Top Badges / Floating Indicator Pills (Cleanly Framed) -->
  <g class="badge-float" transform="translate(100, 32)">
    <rect width="180" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#f05032" />
    <text x="30" y="19" fill="#c9d1d9" font-size="12" font-weight="600">Git · Version Control</text>
  </g>

  <g class="badge-float-alt" transform="translate(500, 32)">
    <rect width="200" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#8957e5" />
    <text x="30" y="19" fill="#c9d1d9" font-size="12" font-weight="600">GitHub &amp; Enterprise CI</text>
  </g>

  <g class="badge-float" transform="translate(900, 32)">
    <rect width="190" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#fc6d26" />
    <text x="30" y="19" fill="#c9d1d9" font-size="12" font-weight="600">GitLab &amp; Webhook Hub</text>
  </g>

  <!-- Foreground Main Content Container (Guaranteed Sharp Foreground) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Category Pill -->
    <rect x="-160" y="-35" width="320" height="28" rx="14" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1.2" />
    <text x="0" y="-17" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="1.2">DEVOPS &amp; REPOSITORY ECOSYSTEM</text>

    <!-- Main Title with Glowing Gradient Effect -->
    <text x="0" y="40" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Git · GitHub · GitLab</text>
    <text x="0" y="40" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">Awesome Git · GitHub · GitLab</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="80" fill="#8b949e" font-size="18" font-weight="500">Repository Integration, CI/CD Pipeline Automation &amp; Self-Hosted Tooling</text>
  </g>

  <!-- Bottom Dynamic Features Bar -->
  <g transform="translate(180, 290)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(0, 0)">
      <rect width="250" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
      <text x="20" y="22" fill="#58a6ff" font-size="13" font-weight="600">⚡ SaaS Platforms &amp; CI/CD</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(290, 0)">
      <rect width="250" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
      <text x="20" y="22" fill="#3fb950" font-size="13" font-weight="600">🌟 Top Open-Source Projects</text>
    </g>

    <!-- Pill 3: Self-Hosted & Security -->
    <g transform="translate(580, 0)">
      <rect width="250" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
      <text x="20" y="22" fill="#d29922" font-size="13" font-weight="600">🛡️ Self-Hosted &amp; GitOps Security</text>
    </g>
  </g>
</svg>
